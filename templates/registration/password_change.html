{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
  <h1 class="text-2xl font-semibold">Change password</h1>
  <form class="mt-4" method="post">
    {% csrf_token %}
    {% for field in form %}
      {% include "includes/field.html" %}
    {% endfor %}
    <button class="btn-primary" type="submit">Update password</button>
  </form>
{% endblock %}
