{% extends "base.html" %}
{% block title %}Children{% endblock %}
{% block content %}
  <div class="mb-3 flex items-center justify-between gap-3">
    <h1 class="text-2xl font-semibold">Children</h1>
    {% if can_manage_records %}
      <a class="btn-secondary" href="{% url 'children:create' %}">+ Add</a>
    {% endif %}
  </div>
  <form id="child-search" method="get" action="{% url 'children:list' %}"
        hx-get="{% url 'children:list' %}"
        hx-target="#child-results"
        hx-swap="outerHTML"
        hx-push-url="true"
        hx-trigger="submit, keyup changed delay:300ms from:input[name=q], change from:select">
    <label class="field-label" for="q">Search</label>
    <input class="field-input" id="q" type="search" name="q" value="{{ request.GET.q }}" placeholder="Name, parent, phone, school, or class" enterkeyhint="search">
    <details class="mt-3" {% if filters_open %}open{% endif %}>
      <summary class="cursor-pointer py-2 text-sm font-bold text-primary">Filters</summary>
      <div class="mt-2 grid gap-3">
        <div>
          <label class="field-label" for="id_class_level">Class</label>
          <select class="field-input" id="id_class_level" name="class_level">
            <option value="">All classes</option>
            {% for value, label in class_levels %}
              <option value="{{ value }}" {% if request.GET.class_level == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
            <option value="none" {% if request.GET.class_level == "none" %}selected{% endif %}>No class yet</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="id_division">Sabbath class</label>
          <select class="field-input" id="id_division" name="division">
            <option value="">All Sabbath classes</option>
            {% for band in sabbath_classes %}
              <option value="{{ band.slug }}" {% if request.GET.division == band.slug %}selected{% endif %}>{{ band.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label" for="id_youth">Youth group</label>
          <select class="field-input" id="id_youth" name="youth">
            <option value="">All youth groups</option>
            {% for band in youth_groups %}
              <option value="{{ band.slug }}" {% if request.GET.youth == band.slug %}selected{% endif %}>{{ band.name }}</option>
            {% endfor %}
            <option value="none" {% if request.GET.youth == "none" %}selected{% endif %}>No youth group</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label" for="id_gender">Gender</label>
            <select class="field-input" id="id_gender" name="gender">
              <option value="">All</option>
              {% for value, label in genders %}
                <option value="{{ value }}" {% if request.GET.gender == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="field-label" for="id_status">Status</label>
            <select class="field-input" id="id_status" name="status">
              <option value="all" {% if request.GET.status == "all" %}selected{% endif %}>All</option>
              {% for value, label in statuses %}
                <option value="{{ value }}" {% if request.GET.status == value or not request.GET.status and value == "ACTIVE" %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="field-label" for="age_min">Minimum age</label>
            <input class="field-input" id="age_min" name="age_min" inputmode="numeric" value="{{ request.GET.age_min }}">
          </div>
          <div>
            <label class="field-label" for="age_max">Maximum age</label>
            <input class="field-input" id="age_max" name="age_max" inputmode="numeric" value="{{ request.GET.age_max }}">
          </div>
        </div>
      </div>
    </details>
  </form>
  {% include "children/partials/results.html" %}
{% endblock %}
